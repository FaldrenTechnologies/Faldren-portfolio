<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="FALDREN — Independent technology company building software, digital products and experiences."
  />

  <meta
    name="theme-color"
    content="#050505"
  />

  <title>FALDREN — Technology / Products / Design</title>


  <style>

    /* =====================================================
       BASE
    ===================================================== */

    html,
    body {
      margin: 0;
      padding: 0;

      background: #050505;
    }


    body.loader-active {
      overflow: hidden;
    }


    #root {
      min-height: 100vh;
    }



    /* =====================================================
       LOADER SCREEN
    ===================================================== */

    #faldren-loader {

      position: fixed;

      inset: 0;

      z-index: 999999;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: #050505;

      color: #f4f4ef;

      clip-path: inset(0 0 0 0);

      transition:
        clip-path 1.15s cubic-bezier(.76, 0, .24, 1),
        visibility 1.15s;

    }


    #faldren-loader.loader-hide {

      clip-path: inset(0 0 100% 0);

      visibility: hidden;

      pointer-events: none;

    }



    /* =====================================================
       SUBTLE BACKGROUND GRID
    ===================================================== */

    .loader-grid {

      position: absolute;

      inset: 0;

      opacity: .12;

      background-image:

        linear-gradient(
          rgba(255,255,255,.04) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,.04) 1px,
          transparent 1px
        );

      background-size:
        70px
        70px;

      animation:
        loaderGridMove
        14s
        linear
        infinite;

    }



    /* =====================================================
       AMBIENT GLOW
    ===================================================== */

    .loader-glow {

      position: absolute;

      width: 550px;

      height: 550px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(112, 125, 83, .12),
          transparent 66%
        );

      filter: blur(10px);

      animation:
        loaderGlow
        4s
        ease-in-out
        infinite
        alternate;

    }



    /* =====================================================
       CONTENT
    ===================================================== */

    .loader-content {

      position: relative;

      z-index: 5;

      width: min(82vw, 720px);

      display: flex;

      flex-direction: column;

      align-items: stretch;

    }



    /* =====================================================
       TOP META
    ===================================================== */

    .loader-meta {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 26px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 9px;

      letter-spacing: .22em;

      text-transform: uppercase;

      color: rgba(255,255,255,.38);

      opacity: 0;

      animation:
        loaderMetaIn
        .7s
        ease
        forwards
        .2s;

    }



    /* =====================================================
       BRAND
    ===================================================== */

    .loader-brand {

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      padding-bottom: 9px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          52px,
          10vw,
          120px
        );

      line-height: .9;

      font-weight: 700;

      letter-spacing: -.055em;

    }


    .loader-letter-mask {

      display: block;

      overflow: hidden;

    }


    .loader-letter {

      display: block;

      transform: translateY(115%);

      animation:
        loaderLetterReveal
        .85s
        cubic-bezier(.22, 1, .36, 1)
        forwards;

    }


    .loader-letter-mask:nth-child(1) .loader-letter {
      animation-delay: .18s;
    }

    .loader-letter-mask:nth-child(2) .loader-letter {
      animation-delay: .24s;
    }

    .loader-letter-mask:nth-child(3) .loader-letter {
      animation-delay: .30s;
    }

    .loader-letter-mask:nth-child(4) .loader-letter {
      animation-delay: .36s;
    }

    .loader-letter-mask:nth-child(5) .loader-letter {
      animation-delay: .42s;
    }

    .loader-letter-mask:nth-child(6) .loader-letter {
      animation-delay: .48s;
    }

    .loader-letter-mask:nth-child(7) .loader-letter {
      animation-delay: .54s;
    }



    /* =====================================================
       LOADING BAR
    ===================================================== */

    .loader-bar-wrap {

      position: relative;

      width: 100%;

      height: 44px;

      margin-top: 34px;

      padding: 6px;

      overflow: hidden;

      border: 2px solid rgba(255,255,255,.88);

      opacity: 0;

      transform: scaleX(.85);

      animation:
        loaderBarIn
        .7s
        cubic-bezier(.22,1,.36,1)
        forwards
        .65s;

    }


    .loader-bar-bg {

      position: relative;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background:
        rgba(255,255,255,.05);

    }


    .loader-bar-fill {

      position: absolute;

      left: 0;

      top: 0;

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          #e9e9e3,
          #ffffff
        );

      transition:
        width .1s linear;

      overflow: hidden;

    }



    /* moving shine inside bar */

    .loader-bar-fill::after {

      content: '';

      position: absolute;

      top: 0;

      left: -80px;

      width: 80px;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.65),
          transparent
        );

      animation:
        loaderScan
        1.1s
        linear
        infinite;

    }



    /* =====================================================
       BOTTOM INFO
    ===================================================== */

    .loader-info {

      display: grid;

      grid-template-columns:
        1fr
        auto;

      align-items: center;

      gap: 20px;

      margin-top: 18px;

      opacity: 0;

      animation:
        loaderMetaIn
        .6s
        ease
        forwards
        .85s;

    }


    .loader-status {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: .18em;

      text-transform: uppercase;

      color: rgba(255,255,255,.62);

    }


    .loader-count {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 28px;

      font-weight: 500;

      letter-spacing: -.05em;

      color: #fff;

    }



    /* =====================================================
       READY STATE
    ===================================================== */

    #faldren-loader.ready
    .loader-brand {

      animation:
        brandReady
        .65s
        cubic-bezier(.22,1,.36,1)
        forwards;

    }


    #faldren-loader.ready
    .loader-bar-wrap {

      border-color: #788260;

      box-shadow:
        0 0 26px
        rgba(120,130,96,.16);

    }


    #faldren-loader.ready
    .loader-status {

      color: #929d71;

    }



    /* =====================================================
       SCAN LINE
    ===================================================== */

    .loader-scanline {

      position: absolute;

      left: 0;

      right: 0;

      height: 1px;

      top: 0;

      background:
        rgba(255,255,255,.08);

      animation:
        screenScan
        3s
        linear
        infinite;

      pointer-events: none;

    }



    /* =====================================================
       KEYFRAMES
    ===================================================== */

    @keyframes loaderLetterReveal {

      to {
        transform:
          translateY(0);
      }

    }


    @keyframes loaderMetaIn {

      from {

        opacity: 0;

        transform:
          translateY(8px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes loaderBarIn {

      from {

        opacity: 0;

        transform:
          scaleX(.85);

      }

      to {

        opacity: 1;

        transform:
          scaleX(1);

      }

    }


    @keyframes loaderGridMove {

      from {

        background-position:
          0
          0;

      }

      to {

        background-position:
          70px
          70px;

      }

    }


    @keyframes loaderGlow {

      from {

        transform:
          scale(.85);

        opacity: .4;

      }

      to {

        transform:
          scale(1.15);

        opacity: .9;

      }

    }


    @keyframes loaderScan {

      from {

        transform:
          translateX(0);

      }

      to {

        transform:
          translateX(760px);

      }

    }


    @keyframes screenScan {

      from {

        transform:
          translateY(0);

      }

      to {

        transform:
          translateY(100vh);

      }

    }


    @keyframes brandReady {

      0% {

        transform:
          scale(1);

        letter-spacing:
          -.055em;

      }

      60% {

        transform:
          scale(1.045);

        letter-spacing:
          -.025em;

      }

      100% {

        transform:
          scale(1);

        letter-spacing:
          -.04em;

      }

    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .loader-content {

        width:
          calc(100% - 40px);

      }


      .loader-meta {

        font-size: 7px;

        margin-bottom: 20px;

      }


      .loader-brand {

        font-size:
          clamp(
            46px,
            17vw,
            72px
          );

      }


      .loader-bar-wrap {

        height: 34px;

        margin-top: 28px;

        padding: 5px;

      }


      .loader-status {

        font-size: 8px;

      }


      .loader-count {

        font-size: 23px;

      }

    }

  </style>

</head>



<body class="loader-active">


  <!-- =====================================================
       FALDREN CINEMATIC LOADER
  ====================================================== -->

  <div id="faldren-loader">


    <div class="loader-grid"></div>

    <div class="loader-glow"></div>

    <div class="loader-scanline"></div>



    <div class="loader-content">


      <!-- TOP -->

      <div class="loader-meta">

        <span>
          FALDREN / SYSTEM
        </span>

        <span>
          EXPERIENCE 001
        </span>

      </div>



      <!-- BRAND -->

      <div class="loader-brand">


        <span class="loader-letter-mask">
          <span class="loader-letter">
            F
          </span>
        </span>


        <span class="loader-letter-mask">
          <span class="loader-letter">
            A
          </span>
        </span>


        <span class="loader-letter-mask">
          <span class="loader-letter">
            L
          </span>
        </span>


        <span class="loader-letter-mask">
          <span class="loader-letter">
            D
          </span>
        </span>


        <span class="loader-letter-mask">
          <span class="loader-letter">
            R
          </span>
        </span>


        <span class="loader-letter-mask">
          <span class="loader-letter">
            E
          </span>
        </span>


        <span class="loader-letter-mask">
          <span class="loader-letter">
            N
          </span>
        </span>


      </div>



      <!-- BAR -->

      <div class="loader-bar-wrap">

        <div class="loader-bar-bg">

          <div
            class="loader-bar-fill"
            id="loader-bar-fill"
          ></div>

        </div>

      </div>



      <!-- INFO -->

      <div class="loader-info">


        <div
          class="loader-status"
          id="loader-status"
        >
          INITIALIZING
        </div>


        <div
          class="loader-count"
          id="loader-count"
        >
          00
        </div>


      </div>


    </div>


  </div>



  <!-- =====================================================
       REACT
  ====================================================== -->

  <div id="root"></div>



  <!-- =====================================================
       LOADER LOGIC
  ====================================================== -->

  <script>

    (() => {


      const loader =
        document.getElementById(
          'faldren-loader'
        );


      const bar =
        document.getElementById(
          'loader-bar-fill'
        );


      const count =
        document.getElementById(
          'loader-count'
        );


      const status =
        document.getElementById(
          'loader-status'
        );


      let progress = 0;

      let finished = false;



      /* =========================================
         UPDATE UI
      ========================================= */

      function updateLoader(value) {


        const rounded =
          Math.floor(value);


        if (bar) {

          bar.style.width =
            `${rounded}%`;

        }


        if (count) {

          count.textContent =
            String(
              rounded
            ).padStart(
              2,
              '0'
            );

        }



        if (!status) return;


        if (rounded < 28) {

          status.textContent =
            'INITIALIZING SYSTEM';

        }

        else if (rounded < 56) {

          status.textContent =
            'LOADING INTERFACE';

        }

        else if (rounded < 82) {

          status.textContent =
            'BUILDING EXPERIENCE';

        }

        else if (rounded < 100) {

          status.textContent =
            'FINALIZING';

        }

        else {

          status.textContent =
            'READY';

        }

      }



      /* =========================================
         FINISH
      ========================================= */

      function completeLoader() {


        if (finished) return;


        finished = true;


        progress = 100;


        updateLoader(100);


        loader?.classList.add(
          'ready'
        );



        /*
          hold READY moment
        */

        setTimeout(
          () => {

            loader?.classList.add(
              'loader-hide'
            );


            document.body.classList.remove(
              'loader-active'
            );

          },
          650
        );



        /*
          completely remove loader
        */

        setTimeout(
          () => {

            loader?.remove();

          },
          1900
        );

      }



      /* =========================================
         FAKE BUT NATURAL PROGRESS
      ========================================= */

      const interval =
        setInterval(
          () => {


            if (finished) {

              clearInterval(
                interval
              );

              return;

            }



            let increment;



            if (progress < 25) {

              increment =
                Math.random()
                * 7
                + 2;

            }

            else if (progress < 55) {

              increment =
                Math.random()
                * 4
                + 1;

            }

            else if (progress < 78) {

              increment =
                Math.random()
                * 2.5
                + .5;

            }

            else {

              increment =
                Math.random()
                * .8
                + .15;

            }



            progress =
              Math.min(
                94,
                progress
                + increment
              );


            updateLoader(
              progress
            );


          },
          85
        );



      /* =========================================
         PAGE READY
      ========================================= */

      window.addEventListener(
        'load',
        () => {

          setTimeout(
            completeLoader,
            2000
          );

        }
      );



      /* =========================================
         FAIL SAFE

         React error aanaalum
         loader forever stay aagaathu
      ========================================= */

      setTimeout(
        completeLoader,
        5000
      );


    })();

  </script>



  <script
    type="module"
    src="/src/main.jsx"
  ></script>


</body>

</html>
