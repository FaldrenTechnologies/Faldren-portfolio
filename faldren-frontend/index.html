<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Primary SEO -->
  <title>FALDREN Technologies | Software, Products & Digital Solutions</title>

  <meta
    name="description"
    content="FALDREN Technologies is an independent technology company building modern software, digital products and web experiences."
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <meta
    name="author"
    content="FALDREN Technologies"
  />

  <link
    rel="canonical"
    href="https://faldrentechnologies.in/"
  />

  <meta
    name="theme-color"
    content="#050505"
  />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="FALDREN Technologies"
  />

  <meta
    property="og:title"
    content="FALDREN Technologies | Software, Products & Digital Solutions"
  />

  <meta
    property="og:description"
    content="Independent technology company building modern software, digital products and web experiences."
  />

  <meta
    property="og:url"
    content="https://faldrentechnologies.in/"
  />

  <!-- Twitter / Social Preview -->
  <meta
    name="twitter:card"
    content="summary"
  />

  <meta
    name="twitter:title"
    content="FALDREN Technologies | Software, Products & Digital Solutions"
  />

  <meta
    name="twitter:description"
    content="Independent technology company building modern software, digital products and web experiences."
  />

  <!-- Organization Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "FALDREN Technologies",
    "url": "https://faldrentechnologies.in/",
    "description": "Independent technology company building modern software, digital products and web experiences."
  }
  </script>

  <!--
    Keep the first paint black so the video intro appears
    cleanly before React/CSS finishes loading.
    The actual homepage theme still comes from styles.css.
  -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #050505;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
